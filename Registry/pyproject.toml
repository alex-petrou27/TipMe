[project]
name = "tipme-registry"
version = "0.1.0"
description = "TipMe creator registry — maps a TikTok/Instagram handle to the creator's wallet"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "cryptography>=41",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "bitcoin-utils>=0.7",
    "mnemonic>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
