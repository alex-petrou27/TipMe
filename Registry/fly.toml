# Fly.io app config for the TipMe registry. Generated by `fly launch` and
# hand-edited -- see README.md's "Deploying the registry" for the full,
# one-time setup (creating the app, the volume, and the secrets below).
app = "tipme-registry"
primary_region = "lhr"

[build]

[env]
  REGISTRY_DATABASE_PATH = "/data/tipme_registry.sqlite3"
  REGISTRY_PHOTOS_DIR = "/data/photos"

[[mounts]]
  source = "tipme_registry_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
