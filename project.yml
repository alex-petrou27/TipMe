# XcodeGen manifest. Generate the project with:
#   brew install xcodegen && xcodegen generate
#
# The project file is generated rather than committed so that target
# membership, entitlements and the extension's embedding cannot drift out of
# sync through merge conflicts in a 10,000-line pbxproj.
name: TipMe
options:
  bundleIdPrefix: technology.tipme
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

# Secrets.xcconfig is generated from .env by Scripts/make-xcconfig.sh and is
# gitignored. Base.xcconfig holds everything that is not a secret.
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  TipMeCore:
    path: .

targets:
  TipMe:
    type: application
    platform: iOS
    sources:
      # Excludes Info.plist from the directory scan so it is never swept
      # into Copy Bundle Resources as a plain file alongside the processed
      # one INFOPLIST_FILE produces.
      - path: App/TipMe
        excludes:
          - Info.plist
      - path: App/Shared
    entitlements:
      path: App/TipMe/TipMe.entitlements
    dependencies:
      - target: TipMeShare
        embed: true
      - package: TipMeCore
        product: TipMeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: technology.tipme.app
        SWIFT_VERSION: "5.9"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Strict concurrency catches the actor-isolation mistakes that would
        # otherwise show up as a race in the payment path.
        SWIFT_STRICT_CONCURRENCY: complete
        # Point straight at the real file via the build setting rather than
        # XcodeGen's own `info:` key: `info: path:` tells XcodeGen to
        # generate and own the plist at that path, rewriting it from a bare
        # template on every `xcodegen generate` and silently destroying
        # NSExtension, the app group keys, everything -- confirmed directly
        # via `git diff` on the file immediately after a `generate` run. Not
        # a build-setting problem at all; do not reintroduce `info:` here.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/TipMe/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  TipMeShare:
    type: app-extension
    platform: iOS
    entitlements:
      path: App/TipMeShare/TipMeShare.entitlements
    dependencies:
      - package: TipMeCore
        product: TipMeCore
      # The extension reuses the app's wallet/support sources rather than
      # duplicating them, so both processes build the identical object graph.
      - sdk: LocalAuthentication.framework
    sources:
      # See the same exclusion on the TipMe target above.
      - path: App/TipMeShare
        excludes:
          - Info.plist
      - path: App/Shared
      - path: App/TipMe/Wallet
      - path: App/TipMe/Support
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: technology.tipme.app.share
        SWIFT_VERSION: "5.9"
        SWIFT_STRICT_CONCURRENCY: complete
        # See the same setting and comment on the TipMe target above -- this
        # is the actual fix for the "does not define an NSExtension
        # dictionary" install failure: no `info:` key means XcodeGen never
        # rewrites App/TipMeShare/Info.plist, so the real file (with
        # NSExtension) is what ships.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/TipMeShare/Info.plist

schemes:
  TipMe:
    build:
      targets:
        TipMe: all
        TipMeShare: all
    run:
      config: Debug
    # TipMeCore's tests are a SwiftPM test target, not an Xcode one.
    # Run them with `swift test` from the repo root — see README.
    test:
      config: Debug
