name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The important one. TipMeCore is Foundation-only, so it compiles and its
  # tests run on a macOS runner without Xcode project generation, code signing,
  # or a device. This is where the parsing, fee, cap, rate-limit, engine and
  # registry-client logic is actually verified.
  core:
    name: TipMeCore (build + test)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test --parallel

  # Static checks that need no Swift toolchain, so they report even when the
  # macOS job is queued or unavailable.
  sanity:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Swift sanity checks
        run: python3 Scripts/swift-sanity.py
      - name: xcconfig generator works against the example env
        run: |
          cp .env.example .env
          ./Scripts/make-xcconfig.sh
          # Server-side secrets must never reach the app bundle.
          if grep -qE '^REGISTRY_' Config/Secrets.xcconfig; then
            echo "::error::registry secrets leaked into the app xcconfig"
            exit 1
          fi

  registry:
    name: Registry service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Registry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  # The app and extension targets. More fragile than the core job — it resolves
  # the Breez and BIP-39 packages over the network and generates the project —
  # so it is kept separate, and code signing is disabled since CI has no team.
  app:
    name: App + share extension (build only)
    # macos-15 rather than macos-14: current XcodeGen emits project format 77,
    # which Xcode 15.4 (the macos-14 default) refuses to open.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -i "^Xcode" || true
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1 || echo /Applications/Xcode.app)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate configuration
        run: |
          cp .env.example .env
          ./Scripts/make-xcconfig.sh

      # Checks whether XcodeGen's own `info:` handling rewrites the real
      # Info.plist files on disk during generation -- if it does, whatever
      # INFOPLIST_FILE/GENERATE_INFOPLIST_FILE build settings say is moot,
      # since xcodebuild would then be processing an already-gutted file.
      - name: Snapshot Info.plist files before generation
        run: |
          echo "--- App/TipMe/Info.plist before ---"
          cat App/TipMe/Info.plist
          echo "--- App/TipMeShare/Info.plist before ---"
          cat App/TipMeShare/Info.plist

      - name: Generate project
        run: xcodegen generate

      - name: Diff Info.plist files after generation
        run: |
          echo "--- App/TipMe/Info.plist after ---"
          cat App/TipMe/Info.plist
          echo "--- App/TipMeShare/Info.plist after ---"
          cat App/TipMeShare/Info.plist
          echo "--- git diff against committed versions ---"
          git diff -- App/TipMe/Info.plist App/TipMeShare/Info.plist

      - name: Build
        run: |
          xcodebuild build \
            -project TipMe.xcodeproj \
            -scheme TipMe \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # A build can succeed (exit 0) while still packaging a broken bundle --
      # xcodebuild does not fail just because Info.plist processing produced
      # something incomplete. This is the actual install-time check ("does
      # not define an NSExtension dictionary") run against CI's own output,
      # so a regression here is caught before it ever reaches a device.
      - name: Verify TipMeShare.appex has a real Info.plist
        run: |
          APPEX=$(find build-dd/Build/Products -name "TipMeShare.appex" -maxdepth 4 | head -1)
          if [[ -z "$APPEX" ]]; then
            echo "::error::TipMeShare.appex not found in build products"
            find build-dd/Build/Products -maxdepth 4
            exit 1
          fi
          echo "found: $APPEX"
          PLIST="$APPEX/Info.plist"
          echo "--- Info.plist contents ---"
          plutil -p "$PLIST"
          if ! /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$PLIST"; then
            echo "::error::TipMeShare.appex's Info.plist has no NSExtension dictionary -- this is exactly the install-time failure"
            exit 1
          fi
